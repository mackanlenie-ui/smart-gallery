name: Build Min Ekonomi APK
on:
  push:
    branches: [ build-min-ekonomi-v1 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Ekonomi-v1.5-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Min-Ekonomi-v1.5-unsigned
          path: Min-Ekonomi-v1.5-unsigned.apk
