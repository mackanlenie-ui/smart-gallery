name: Build Min Ekonomi APK
on:
  push:
    branches: [ build-min-ekonomi-v1 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.7 features
        run: python .github/v17_patch.py
      - name: Apply v1.8 features
        run: python .github/v18_patch.py
      - name: Apply v1.8.1 biometric fix
        run: python .github/v181_patch.py
      - name: Apply v1.9 improvements
        run: python .github/v19_patch.py
      - name: Apply v1.9.1 planned purchase fix
        run: python .github/v191_patch.py
      - name: Apply v2.0 improvements
        run: python .github/v20_patch.py
      - name: Apply v2.1 improvements
        run: python .github/v21_patch.py
      - name: Apply v2.2 improvements
        run: python .github/v22_patch.py
      - name: Apply v2.2.1 screenshot fix
        run: python .github/v221_patch.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Ekonomi-v2.2.1-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Min-Ekonomi-v2.2.1-unsigned
          path: Min-Ekonomi-v2.2.1-unsigned.apk
      - name: Prepare apksigner tool
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signer-tool/lib
          cp "$BT/apksigner" signer-tool/
          cp "$BT/lib/apksigner.jar" signer-tool/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-tool
          path: signer-tool
