name: Build Min Ekonomi APK
on:
  push:
    branches: [ build-min-ekonomi-v1 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/v17_patch.py
      - run: python .github/v18_patch.py
      - run: python .github/v181_patch.py
      - run: python .github/v19_patch.py
      - run: python .github/v191_patch.py
      - run: python .github/v20_patch.py
      - run: python .github/v21_patch.py
      - run: python .github/v22_patch.py
      - run: python .github/v221_patch.py
      - run: python .github/v222_patch.py
      - run: python .github/v223_patch.py
      - run: python .github/v224_patch.py
      - run: python .github/v225_patch.py
      - run: python .github/v226_patch.py
      - run: python .github/v227_patch.py
      - run: python .github/v228_patch.py
      - run: python .github/v229_patch.py
      - run: python .github/v2210_patch.py
      - name: Apply v3.0.1 backup polish
        run: python .github/v301_patch.py
      - name: Test v3.0.1 requirements
        run: python .github/test_v301.py
      - name: Apply v3.0.2 settings restoration
        run: python .github/v302_patch.py
      - name: Test v3.0.2 settings preservation
        run: python .github/test_v302.py
      - name: Test v3.0.3 requirements (red)\n        run: python .github/test_v303.py\n      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Min-Ekonomi-v3.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Min-Ekonomi-v3.0.2
          path: Min-Ekonomi-v3.0.2.apk
