name: Build Smart Gallery APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch Apache-2.0 MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/mobilefacenet.tflite https://raw.githubusercontent.com/hugocornellier/face_detection_tflite/main/assets/models/mobilefacenet.tflite
          test -s app/src/main/assets/mobilefacenet.tflite
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Smart-Gallery-1.8-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p apksigner-tool/lib
          cp "$BT/apksigner" apksigner-tool/
          cp "$BT/lib/apksigner.jar" apksigner-tool/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Gallery-1.8-unsigned
          path: Smart-Gallery-1.8-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-tool-smart-gallery-1.8
          path: apksigner-tool
