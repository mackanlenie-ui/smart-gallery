name: Build Smart Gallery TEST APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/mobilefacenet.tflite https://raw.githubusercontent.com/hugocornellier/face_detection_tflite/main/assets/models/mobilefacenet.tflite
          test -s app/src/main/assets/mobilefacenet.tflite
      - name: Build Smart Gallery test
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Prepare APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Smart-Gallery-2.3-Google-Photos-TEST.apk
          ls -lh Smart-Gallery-2.3-Google-Photos-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Gallery-2.3-Google-Photos-TEST
          path: Smart-Gallery-2.3-Google-Photos-TEST.apk
          retention-days: 30
